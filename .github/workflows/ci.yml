name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Cross-compile smoke check (Linux, macOS, Windows)
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build ./cmd/ghfetcher
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build ./cmd/ghfetcher
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build ./cmd/ghfetcher
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build ./cmd/ghfetcher
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/ghfetcher
