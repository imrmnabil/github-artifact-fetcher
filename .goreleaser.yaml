version: 2

project_name: ghfetcher

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ghfetcher
    main: ./cmd/ghfetcher
    binary: ghfetcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X ghfetcher/internal/version.Version={{.Version}}
      - -X ghfetcher/internal/version.Commit={{.ShortCommit}}
      - -X ghfetcher/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
  name_template: "ghfetcher {{ .Tag }}"
